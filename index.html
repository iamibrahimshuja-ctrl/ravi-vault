<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scaling With Systems AI - The Ravi Abuvala Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .highlight { color: #38bdf8; font-weight: 700; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // TARGET: RAVI ABUVALA (Scaling With Systems)
        // VIDEO: YouTube's Hard, Until Business Owners Do This
        // ID: rkhSjMbrMG4

        const searchDatabase = [
            {
                id: 1,
                keyword: "Sales",
                videoTitle: "YouTube's Hard, Until Business Owners Do This",
                videoId: "rkhSjMbrMG4",
                occurrences: [
                    { timestamp: 281, text: "...qualified sales calls." },
                    { timestamp: 342, text: "...months of sales calls..." },
                    { timestamp: 411, text: "...in their sales calls..." },
                    { timestamp: 609, text: "...after they booked the sales call..." }
                ]
            },
            {
                id: 2,
                keyword: "Avatar",
                videoTitle: "YouTube's Hard, Until Business Owners Do This",
                videoId: "rkhSjMbrMG4",
                occurrences: [
                    { timestamp: 95, text: "...not your ideal avatar." },
                    { timestamp: 100, text: "...your ideal avatar." },
                    { timestamp: 142, text: "...our ideal avatar." },
                    { timestamp: 888, text: "...attracts your ideal avatar..." }
                ]
            },
            {
                id: 3,
                keyword: "Business",
                videoTitle: "YouTube's Hard, Until Business Owners Do This",
                videoId: "rkhSjMbrMG4",
                occurrences: [
                    { timestamp: 1, text: "...profitable for your business?" },
                    { timestamp: 8, text: "...Most business owners..." },
                    { timestamp: 163, text: "...What business do I start?" },
                    { timestamp: 1011, text: "...a bigger business and you just want us..." }
                ]
            }
        ];

        function App() {
            const [query, setQuery] = useState("");
            const [results, setResults] = useState([]);
            const [activeVideo, setActiveVideo] = useState(null);
            const [player, setPlayer] = useState(null);
            const playerRef = useRef(null);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [results]);

            // Initialize YouTube Player
            useEffect(() => {
                if (!window.YT) {
                    const tag = document.createElement('script');
                    tag.src = "https://www.youtube.com/iframe_api";
                    const firstScriptTag = document.getElementsByTagName('script')[0];
                    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                    
                    window.onYouTubeIframeAPIReady = () => {
                        console.log("YouTube API Ready");
                    };
                }
            }, []);

            const loadVideo = (videoId, timestamp) => {
                if (player) {
                    player.loadVideoById({videoId: videoId, startSeconds: timestamp});
                } else {
                    new window.YT.Player('youtube-player', {
                        height: '100%',
                        width: '100%',
                        videoId: videoId,
                        playerVars: { 'autoplay': 1, 'start': timestamp },
                        events: {
                            'onReady': (event) => setPlayer(event.target)
                        }
                    });
                }
                setActiveVideo(true);
            };

            const handleSearch = (e) => {
                const val = e.target.value.toLowerCase();
                setQuery(val);
                if (val.length > 1) {
                    const filtered = searchDatabase.filter(item => 
                        item.keyword.toLowerCase().includes(val)
                    );
                    setResults(filtered);
                } else {
                    setResults([]);
                }
            };

            const formatTime = (seconds) => {
                const min = Math.floor(seconds / 60);
                const sec = seconds % 60;
                return `${min}:${sec < 10 ? '0' : ''}${sec}`;
            };

            return (
                <div className="min-h-screen p-8 flex flex-col items-center relative overflow-hidden">
                    {/* Background Elements */}
                    <div className="absolute top-0 left-0 w-full h-full z-0 pointer-events-none">
                        <div className="absolute top-10 left-10 w-64 h-64 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
                        <div className="absolute top-10 right-10 w-64 h-64 bg-slate-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
                        <div className="absolute -bottom-8 left-20 w-64 h-64 bg-indigo-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"></div>
                    </div>

                    <div className="max-w-4xl w-full z-10 flex flex-col gap-8">
                        {/* Header */}
                        <div className="text-center space-y-2">
                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full glass-panel text-xs font-medium text-blue-300 mb-2">
                                <i data-lucide="cpu" className="w-3 h-3"></i>
                                <span>Scaling With Systems AI</span>
                            </div>
                            <h1 className="text-5xl font-bold tracking-tight text-white">
                                The Ravi Abuvala Vault
                            </h1>
                            <p className="text-slate-400 text-lg">
                                Search 1,000+ videos instantly for sales strategy, avatars, and business growth.
                            </p>
                        </div>

                        {/* Search Bar */}
                        <div className="relative group">
                            <div className="absolute -inset-1 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
                            <div className="relative flex items-center bg-slate-900 rounded-2xl border border-slate-700 shadow-2xl overflow-hidden">
                                <div className="pl-6 text-slate-400">
                                    <i data-lucide="search" className="w-6 h-6"></i>
                                </div>
                                <input 
                                    type="text" 
                                    className="w-full bg-transparent p-6 text-xl text-white placeholder-slate-500 focus:outline-none"
                                    placeholder="Search 'Sales', 'Avatar', or 'Business'..."
                                    value={query}
                                    onChange={handleSearch}
                                    autoFocus
                                />
                                {query && (
                                    <button onClick={() => {setQuery(''); setResults([]);}} className="pr-6 text-slate-500 hover:text-white transition">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Video Player Area */}
                        <div className={`transition-all duration-500 ease-out ${activeVideo ? 'h-[400px] opacity-100' : 'h-0 opacity-0'} overflow-hidden rounded-2xl border border-slate-700 shadow-2xl relative bg-black`}>
                            <div id="youtube-player" className="w-full h-full"></div>
                        </div>

                        {/* Results Grid */}
                        <div className="space-y-4">
                            {results.map(result => (
                                <div key={result.id} className="glass-panel rounded-2xl p-6 border-l-4 border-blue-500 transition hover:bg-slate-800/50">
                                    <div className="flex items-center justify-between mb-4">
                                        <div className="flex items-center gap-3">
                                            <div className="p-2 bg-blue-500/10 rounded-lg text-blue-400">
                                                <i data-lucide="youtube" className="w-5 h-5"></i>
                                            </div>
                                            <h3 className="font-semibold text-lg text-white">{result.videoTitle}</h3>
                                        </div>
                                    </div>
                                    
                                    <div className="space-y-3 pl-12">
                                        {result.occurrences.map((occ, idx) => (
                                            <div 
                                                key={idx} 
                                                onClick={() => loadVideo(result.videoId, occ.timestamp)}
                                                className="group flex items-start gap-4 p-3 rounded-xl hover:bg-white/5 cursor-pointer border border-transparent hover:border-white/10 transition-all"
                                            >
                                                <div className="flex-shrink-0 mt-1">
                                                    <span className="px-2 py-1 rounded bg-slate-700 text-xs font-mono text-blue-300 group-hover:bg-blue-600 group-hover:text-white transition">
                                                        {formatTime(occ.timestamp)}
                                                    </span>
                                                </div>
                                                <p className="text-slate-300 text-sm leading-relaxed">
                                                    ...{occ.text}...
                                                </p>
                                                <div className="ml-auto opacity-0 group-hover:opacity-100 transition text-blue-400">
                                                    <i data-lucide="play-circle" className="w-5 h-5"></i>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}

                            {query.length > 1 && results.length === 0 && (
                                <div className="text-center py-12">
                                    <p className="text-slate-500">No mentions found for "{query}" in the database.</p>
                                </div>
                            )}
                            
                            {!query && (
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-8">
                                    {['Sales', 'Avatar', 'Business'].map(tag => (
                                        <button 
                                            key={tag}
                                            onClick={() => {
                                                setQuery(tag.toLowerCase());
                                                const filtered = searchDatabase.filter(item => item.keyword.toLowerCase().includes(tag.toLowerCase()));
                                                setResults(filtered);
                                            }}
                                            className="p-4 glass-panel rounded-xl text-center hover:bg-white/5 transition border border-slate-700 hover:border-blue-500/50 group"
                                        >
                                            <span className="text-slate-400 group-hover:text-white font-medium">{tag}</span>
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
